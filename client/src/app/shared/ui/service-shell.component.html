<a class="skip-link" href="#service-main">Skip to content</a>
<button *ngIf="mobile && menuOpen" class="drawer-backdrop" aria-label="Close navigation" tabindex="-1" (click)="closeMenu()"></button>
<andy-app-shell [class.no-chrome]="!chrome" [collapsed]="collapsed && !mobile">
  <andy-sidebar *ngIf="chrome" slot="sidebar" #drawer id="service-navigation" class="service-sidebar" [class.is-open]="menuOpen"
    [collapsed]="collapsed && !mobile" [collapsible]="!mobile" (andy-collapse-toggle)="collapseChanged($event)"
    [attr.role]="mobile ? 'dialog' : null" [attr.aria-modal]="mobile && menuOpen ? 'true' : null"
    [attr.aria-label]="serviceName + ' navigation'">
    <span slot="brand" class="sidebar-brand__mark" aria-hidden="true">R</span>
    <span slot="brand" class="sidebar-brand__text collapsed-hide"><strong class="sidebar-brand__name">{{ serviceName }}</strong><span class="sidebar-brand__tagline">Rivoli AI</span></span>
    <button slot="brand" type="button" class="drawer-close" aria-label="Close navigation" (click)="closeMenu()">×</button>
    <p class="service-description">{{ serviceDescription }}</p>
    <andy-nav-section *ngFor="let group of groups" [heading]="group">
      <andy-nav-item *ngFor="let link of linksIn(group); trackBy: trackLink" [href]="href(link.path)" [key]="link.path"
        [active]="isCurrent(link)" [attr.aria-current]="isCurrent(link) ? 'page' : null" (click)="navigateLink($event)">
        <svg slot="icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true"><path [attr.d]="link.path === '/help' ? 'M12 17v-5m0-4v1M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18' : link.path === '/sandboxes' ? 'M3 7l9-4 9 4v10l-9 4-9-4V7zm0 0l9 4 9-4M12 11v10' : link.path === '/settings' ? 'M4 7h16M4 17h16M8 4v6M16 14v6' : 'M3 3h7v7H3zM14 3h7v7h-7zM3 14h7v7H3zM14 14h7v7h-7z'"></path></svg>
        {{ link.label }}
      </andy-nav-item>
    </andy-nav-section>
    <ng-content select="[service-nav-extra]"></ng-content>
    <span slot="footer" class="workspace-name collapsed-hide">Rivoli workspace</span>
  </andy-sidebar>
  <header *ngIf="chrome" slot="header" class="service-topbar" [attr.inert]="mobile && menuOpen ? '' : null">
    <button #menuButton type="button" class="menu-button" aria-label="Open navigation" aria-controls="service-navigation"
      [attr.aria-expanded]="menuOpen" (click)="openMenu()">☰</button>
    <andy-breadcrumb [items]="breadcrumbs" (click)="navigateLink($event)"></andy-breadcrumb>
    <div class="account"><ng-content select="[service-account]"></ng-content></div>
    <andy-theme-toggle (andy-theme-change)="themeChanged($event)"></andy-theme-toggle>
  </header>
  <main #mainContent id="service-main" class="service-main" tabindex="-1" [attr.inert]="mobile && menuOpen ? '' : null"><ng-content></ng-content></main>
</andy-app-shell>
